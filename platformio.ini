[platformio]
default_envs = cyd2usb

; ESP32-2432S028R, two-USB-port variant (ST7789 panel).
; Flash over the micro-USB port: the USB-C port has no CC resistors.
[env:cyd2usb]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = huge_app.csv

lib_deps =
	h2zero/NimBLE-Arduino @ ^2.2.3
	bodmer/TFT_eSPI @ ^2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

build_flags =
	-DCORE_DEBUG_LEVEL=1

	; Four links in normal use: KICKR, Di2 and cadence clients, plus the training
	; app connected to our server. One spare.
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=5
	-DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=255

	; TFT_eSPI, transcribed from DisplayConfig/CYD2USB/User_Setup.h
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF=1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DUSE_HSPI_PORT=1
